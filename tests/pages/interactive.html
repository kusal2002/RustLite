<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RustLite scripting</title>
<style>
  body { font-family: Georgia, serif; margin: 24px; background: #f6f4ef; color: #222 }
  h1 { font-size: 26px; margin: 0 0 8px }
  .card { background: white; border: 1px solid #ddd; padding: 12px 16px; margin: 12px 0; width: 520px }
  .count { font-size: 40px; font-weight: bold; color: #1a5fb4 }
  .button { background: #1a5fb4; color: white; padding: 6px 12px; width: 140px; margin-top: 8px }
  .done { color: #888 }
  li.done { color: #2e7d32 }
</style>
</head>
<body>
<h1>Scripting demo</h1>
<p id="status">Scripts have not run.</p>

<div class="card">
  <div>Clicks: <span id="count" class="count">0</span></div>
  <div id="increment" class="button">Click to count</div>
</div>

<div class="card">
  <p>Tasks (click one to toggle it):</p>
  <ul id="tasks"></ul>
  <div id="reset" class="button" onclick="resetTasks(); return false">Reset tasks</div>
</div>

<div class="card">
  <p>Live: <span id="clock">--</span> · frames drawn: <span id="frames">0</span></p>
  <div id="track" style="background-color: #e0e0e0; height: 8px; width: 300px">
    <div id="bar" style="background-color: #2e7d32; height: 8px; width: 0px"></div>
  </div>
</div>

<div class="card">
  <form id="greet" action="https://example.com/">
    Name: <input id="name" name="name" placeholder="Type your name">
    <label><input id="loud" type="checkbox"> loud</label>
    <button id="send">Greet</button>
  </form>
  <p id="greeting">Nobody greeted yet.</p>
</div>

<p><a id="guarded" href="https://example.com/">This link is handled by a script</a></p>

<script>
  const tasks = ['Parse HTML', 'Compute styles', 'Lay out', 'Run scripts'];
  const list = document.getElementById('tasks');

  function resetTasks() {
    list.innerHTML = '';
    for (const name of tasks) {
      const li = document.createElement('li');
      li.textContent = name;
      li.addEventListener('click', () => li.classList.toggle('done'));
      list.appendChild(li);
    }
  }
  resetTasks();

  let clicks = 0;
  document.getElementById('increment').addEventListener('click', () => {
    clicks += 1;
    document.getElementById('count').textContent = String(clicks);
    document.title = `Clicked ${clicks} time${clicks === 1 ? '' : 's'}`;
  });

  document.getElementById('guarded').addEventListener('click', (event) => {
    event.preventDefault();
    document.getElementById('status').textContent = 'The link click was cancelled by a script.';
  });

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('status').textContent =
      `Scripts ran: ${document.querySelectorAll('#tasks li').length} tasks created.`;
  });
  const started = performance.now();
  setInterval(() => {
    document.getElementById('clock').textContent =
      `${((performance.now() - started) / 1000).toFixed(0)} s since load`;
  }, 1000);

  let frames = 0;
  function animate() {
    frames += 1;
    document.getElementById('frames').textContent = String(frames);
    document.getElementById('bar').style.width = `${Math.min(300, frames * 5)}px`;
    if (frames < 60) requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);

  document.getElementById('greet').addEventListener('submit', (event) => {
    event.preventDefault();
    const name = document.getElementById('name').value || 'stranger';
    const loud = document.getElementById('loud').checked;
    const text = `Hello, ${name}!`;
    document.getElementById('greeting').textContent = loud ? text.toUpperCase() : text;
  });
  console.log('interactive page ready');
</script>
</body>
</html>
