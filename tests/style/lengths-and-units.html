<!DOCTYPE html><!-- compare: font-size line-height margin-top margin-left padding-top padding-left -->
<style>
html { font-size: 10px; }
#a { font-size: 2em; margin-top: 1.5em; padding-left: 2rem; }
#b { font-size: 150%; line-height: 1.5; }
#c { font-size: 12pt; margin-top: 1in; padding-left: 1cm; }
#d { font-size: 2rem; margin-left: 10vw; padding-top: 5vh; }
#e { font-size: larger; line-height: 20px; }
#f { font-size: smaller; line-height: 150%; }
#g { font-size: x-large; margin-top: -1em; }
#h { font-size: 1.25em; line-height: 2; }
#i { margin-top: 3pc; padding-left: 10mm; }
#j { margin-left: 5vmin; padding-top: 2vmax; }
</style>
<div id=a>a<div id=h>h</div></div>
<div id=b>b</div><div id=c>c</div><div id=d>d</div>
<div id=e>e<div id=f>f</div></div>
<div id=g>g</div><div id=i>i</div><div id=j>j</div>
