<!DOCTYPE html><!-- tolerance: 0.1 --><!-- fonts: Times New Roman; 14 3 1 -->
<style>html { font-family: "Times New Roman" } body { margin: 8px } div { box-sizing: content-box }</style>
<div id=rel style="position: relative; top: 10px; left: 20px; width: 100px; height: 30px; background: #ccc">

</div>
<div id=relpct style="position: relative; right: 10%; bottom: 5px; height: 20px"></div>

  <div id=br style="position: absolute; bottom: 5px; right: 7px; width: 40px; height: 30px"></div>
  <div id=stretch style="position: absolute; top: 50px; bottom: 50px; left: 60px; right: 60px; padding: 3px"></div>

  <div id=pct style="position: absolute; top: 10%; left: 50%; width: 25%; height: 20%"></div>

</div>
