<!DOCTYPE html><!-- tolerance: 0.1 -->
<style>body { margin: 8px } div { margin-bottom: 4px; background: #ddd }</style>
<div id=content style="width: 100px; height: 50px; padding: 10px; border: 5px solid"></div>
<div id=border style="box-sizing: border-box; width: 100px; height: 50px; padding: 10px; border: 5px solid"></div>
<div id=tiny style="box-sizing: border-box; width: 10px; height: 10px; padding: 10px"></div>
<div id=maxbb style="box-sizing: border-box; max-width: 120px; padding: 0 10px; border: 1px solid; height: 5px"></div>
<div id=minbb style="box-sizing: border-box; width: 10px; min-width: 60px; padding: 5px; height: 5px"></div>
<div id=pctbb style="box-sizing: border-box; width: 50%; padding: 0 20px; height: 5px"></div>
