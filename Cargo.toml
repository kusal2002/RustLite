[workspace]
resolver = "3"
members = [
    "apps/desktop",
    "benchmarks",
    "crates/browser-core",
    "crates/css",
    "crates/diagnostics",
    "crates/dom",
    "crates/fonts",
    "crates/html",
    "crates/layout",
    "crates/net",
    "crates/paint",
    "crates/renderer",
    "crates/sandbox",
    "crates/script",
    "crates/style",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
# Internal crates
rustlite-browser-core = { path = "crates/browser-core" }
rustlite-css = { path = "crates/css" }
rustlite-diagnostics = { path = "crates/diagnostics" }
rustlite-dom = { path = "crates/dom" }
rustlite-fonts = { path = "crates/fonts" }
rustlite-html = { path = "crates/html" }
rustlite-layout = { path = "crates/layout" }
rustlite-net = { path = "crates/net" }
rustlite-paint = { path = "crates/paint" }
rustlite-renderer = { path = "crates/renderer" }
rustlite-sandbox = { path = "crates/sandbox" }
rustlite-script = { path = "crates/script" }
rustlite-style = { path = "crates/style" }

# External crates (see docs/architecture.md#dependencies for rationale)
arboard = { version = "3.7.0", default-features = false }
# Web compatibility syntax (annex-b) only: no Intl/Temporal data in the binary.
boa_engine = { version = "0.22.0", default-features = false, features = ["annex-b"] }
encoding_rs = "0.8.42"
fontdb = "0.24"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif"] }
rustybuzz = "0.20.1"
self_cell = "1.2.0"
ttf-parser = "0.25.1"
softbuffer = { version = "0.4.8", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
thiserror = "2.0"
tracing = "0.1.44"
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "platform-verifier", "gzip"] }
url = "2.5.8"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
winit = "0.30"
# Raw Win32 bindings for the renderer sandbox only (already in the tree via winit).
libc = "0.2.190"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
